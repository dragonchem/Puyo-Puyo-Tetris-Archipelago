name: Beta

on:
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]
  workflow_dispatch:

jobs:

  client:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    permissions:
      contents: read
      checks: write

    env:
      Solution_Name: Client\Puyo-Puyo-Tetris-Archipelago.sln
      Test_Project_Path: Client\UnitTests\UnitTests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore -c ${{ matrix.configuration }}

    - name: Test
      run: >
        dotnet test $env:Solution_Name --no-build -c ${{ matrix.configuration }}
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory TestResults

    - name: Coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.1
      with:
        reports: 'TestResults/**/*.cobertura.xml'
        targetdir: 'coverage-tmp'
        reporttypes: 'MarkdownSummaryGithub'

    - name: Coverage summary to run page
      if: always()
      shell: pwsh
      run: Get-Content coverage-tmp\SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

    - name: Test report
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: Test results
        path: 'TestResults/**/*.trx'
        reporter: dotnet-trx

    - name: Upload code-coverage (raw)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: TestResults/**/*.cobertura.xml

    - name: Upload test-results (raw)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx

    - name: Publish
      run: >
        dotnet publish Client\Puyo-Puyo-Tetris-Archipelago\Puyo-Puyo-Tetris-Archipelago.csproj
        -c ${{ matrix.configuration }}
        -r win-x64 --self-contained true
        -p:EnableCompressionInSingleFile=true
        -p:PublishSingleFile=true
        -p:DebugType=portable -p:DebugSymbols=true
        -p:SatelliteResourceLanguages=en
        -o publish

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: Puyo-Puyo-Tetris-Archipelago-win-x64
        path: publish

  apworld:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      Package_Name: puyo_puyo_tetris

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Package apworld
      run: |
        mkdir -p dist/$Package_Name
        cp -r World/. dist/$Package_Name/
        find dist/$Package_Name -name '__pycache__' -type d -prune -exec rm -rf {} +
        rm -rf dist/$Package_Name/test
        cd dist
        zip -r -X ../$Package_Name.apworld $Package_Name

    - name: Upload apworld
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Package_Name }}-apworld
        path: ${{ env.Package_Name }}.apworld
