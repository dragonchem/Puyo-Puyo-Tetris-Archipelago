name: Release

on:
  release:
    types: [published]

jobs:

  build:

    runs-on: windows-latest

    permissions:
      contents: write
      checks: write

    env:
      Solution_Name: Client\Puyo-Puyo-Tetris-Archipelago.sln
      Test_Project_Path: Client\UnitTests\UnitTests.csproj
      TAG: ${{ github.event.release.tag_name }}
      CONFIGURATION: ${{ startsWith(github.event.release.tag_name, 'dev_') && 'Debug' || 'Release' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore -c ${{ env.CONFIGURATION }}

    - name: Test
      run: >
        dotnet test $env:Solution_Name --no-build -c ${{ env.CONFIGURATION }}
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory TestResults

    - name: Coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.1
      with:
        reports: 'TestResults/**/*.cobertura.xml'
        targetdir: 'coverage-tmp'
        reporttypes: 'MarkdownSummaryGithub'

    - name: Coverage summary to run page
      if: always()
      shell: pwsh
      run: Get-Content coverage-tmp\SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

    - name: Test report
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: Test results
        path: 'TestResults/**/*.trx'
        reporter: dotnet-trx

    - name: Derive version from tag
      id: v
      shell: pwsh
      run: |
        $num = $env:TAG -replace '^(dev_|beta_)?v', ''
        "num=$num" | Add-Content $env:GITHUB_OUTPUT

    - name: Publish
      run: >
        dotnet publish Client\Puyo-Puyo-Tetris-Archipelago\Puyo-Puyo-Tetris-Archipelago.csproj
        -c ${{ env.CONFIGURATION }}
        -r win-x64 --self-contained true
        -p:EnableCompressionInSingleFile=true
        -p:PublishSingleFile=true
        -p:DebugType=portable -p:DebugSymbols=true
        -p:SatelliteResourceLanguages=en
        -p:Version=${{ steps.v.outputs.num }}
        -p:SourceRevisionId=${{ github.sha }}
        -p:InformationalVersion=${{ env.TAG }}+${{ github.sha }}
        -o publish

    - name: Attach build to the release
      shell: pwsh
      run: |
        $versioned = "Puyo-Puyo-Tetris-Archipelago-$env:TAG.zip"
        Compress-Archive -Path publish\* -DestinationPath $versioned -Force
        gh release upload $env:TAG $versioned --clobber

    - name: Upload code-coverage (raw)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: TestResults/**/*.cobertura.xml

    - name: Upload test-results (raw)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx
